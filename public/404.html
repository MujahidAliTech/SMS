<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TaleemCloud - Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // When a direct URL like /SMS/login is hit on GitHub Pages, GitHub returns 404.html.
      // This script converts the pathname into a hash route (/#/login) and redirects instantly.
      (function() {
        var path = window.location.pathname;
        var parts = path.split('/').filter(Boolean);
        // If repo name is the first segment (e.g., 'SMS')
        var repo = parts.length > 0 ? parts[0] : '';
        var remainingPath = parts.slice(1).join('/');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        
        var target = '/' + repo + '/#/' + remainingPath + search + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <div style="text-align: center;">
      <p style="font-size: 1.125rem; font-weight: 600;">Loading TaleemCloud...</p>
      <p style="font-size: 0.875rem; color: #64748b;">Redirecting to requested page...</p>
    </div>
  </body>
</html>
